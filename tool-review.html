<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool and wardrobe quality matrix</title><style>*{box-sizing:border-box}body{margin:0;background:#faf0d6;color:#354b3c;padding:20px;font:15px/1.5 system-ui}main{max-width:1000px;margin:auto}h1{font:30px Georgia}h2{font:21px Georgia;margin:0 0 8px}.row{margin:22px 0}.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}figure{margin:0}canvas{width:100%;height:130px;background:#8da16b;display:block}figcaption{text-align:center;font-size:13px}.note{max-width:800px}@media(max-width:600px){body{padding:12px}.views{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><main><h1>Tools · wardrobe assembly</h1><p class="note">Every wardrobe combination in four directions. Each pair shows the backswing and strike with the production player and tool renderers. This page never reads or writes your story.</p><label>Tool <select id="tool" aria-label="Tool"><option value="axe">Axe</option><option value="pickaxe">Pickaxe</option></select></label><div id="matrix"></div></main><script type="module">
import {preparePlayer,drawPlayer} from './player-layered.js';import {drawGatheringTool} from './gathering-art.js';await preparePlayer();let tool='axe';const paints=[];document.getElementById('tool').onchange=e=>{tool=e.target.value;paints.forEach(p=>p());};const root=document.getElementById('matrix'),rows=[];
for(const style of [0,1,3,4])for(const outfit of [0,1])for(const hat of [0,1])rows.push({name:({0:'Tousled',1:'Tied back',3:'Rounded bob',4:'Twin puffs'}[style])+' · '+(outfit?'Vest':'Linen')+' · '+(hat?'Cap':'No hat'),look:{skin:1,hair:0,shirt:0,style,outfit,hat}});
for(const {name,look}of rows){const section=document.createElement('section'),title=document.createElement('h2'),views=document.createElement('div');section.className='row';views.className='views';title.textContent=name;for(const direction of ['down','left','right','up']){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.setAttribute('aria-label',name+' '+direction+' tool swing poses');caption.textContent={down:'Front',left:'Left',right:'Right',up:'Back'}[direction];figure.append(canvas,caption);views.append(figure);const paint=()=>{const b=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(b.width*dpr);canvas.height=Math.round(b.height*dpr);const c=canvas.getContext('2d'),zoom=2;c.setTransform(dpr*zoom,0,0,dpr*zoom,0,0);c.imageSmoothingEnabled=false;c.clearRect(0,0,b.width/zoom,b.height/zoom);for(const [position,progress]of [[.3,.28],[.7,.62]]){const action={tool,progress},x=b.width/zoom*position;if(direction==='up')drawGatheringTool(c,x,52,direction,action);drawPlayer(c,x,52,look,0,direction,false,false,false,action);if(direction!=='up')drawGatheringTool(c,x,52,direction,action);}};paints.push(paint);requestAnimationFrame(paint);window.addEventListener('resize',paint);}section.append(title,views);root.append(section);}
</script></html>
