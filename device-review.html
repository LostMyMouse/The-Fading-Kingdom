<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen layout review · The Fading Kingdom</title><style>*{box-sizing:border-box}body{margin:0;background:#d9dfc6;color:#354b3c;font:15px system-ui}header{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#faf0d6;position:sticky;top:0;z-index:2}label{display:flex;gap:8px;align-items:center}select{font:inherit;min-height:44px}p{margin:0;font-size:13px}iframe{display:block;border:0;margin:12px;background:#243e33;width:390px;height:844px}output{font-size:13px}</style><header><label>Screen <select id="size"><option value="390,844">Phone · 390 × 844</option><option value="320,740">Small phone · 320 × 740</option><option value="768,1024">Tablet · 768 × 1024</option><option value="844,390">Landscape phone · 844 × 390</option></select></label><output id="dimensions">Loading…</output><p>Layout review using a separate playtest save. This checks browser layouts, not physical touch-device performance.</p></header><iframe id="preview" title="Game screen preview" src="./index.html?review=bridge"></iframe><script type="module">
const frame=document.getElementById('preview'),size=document.getElementById('size'),output=document.getElementById('dimensions');
function report(){const w=frame.contentWindow,d=frame.contentDocument;output.textContent=`Game viewport: ${w.innerWidth} × ${w.innerHeight}. Horizontal overflow: ${d.documentElement.scrollWidth>w.innerWidth?'yes':'no'}.`;}
size.onchange=()=>{const [w,h]=size.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';requestAnimationFrame(report);};frame.onload=report;
</script></html>
