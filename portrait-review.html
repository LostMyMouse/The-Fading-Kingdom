<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait consistency review</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#faf0d6;color:#354b3c;font:16px system-ui}main{max-width:1150px;margin:auto}h1,h2{font-family:Georgia}section{margin:24px 0}.faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}figure{margin:0}div.face{width:100%;aspect-ratio:1;background-size:300% 200%;image-rendering:pixelated;border:3px solid #b59a68;background-color:#f0d9a9}figcaption{text-align:center;padding:6px;font-size:14px}@media(max-width:600px){body{padding:16px}.faces{grid-template-columns:repeat(3,minmax(0,1fr))}}</style><main><h1>Dialogue portrait consistency</h1><p>Mara and Orin remain the canonical references. Rowan uses the same six expressions and dialogue framing. This page never changes a story.</p><div id="portraits"></div></main><script type="module">
import {portraitFor,EXPRESSIONS} from './chapter-portraits.js';
for(const name of ['Mara','Orin','Rowan']){const section=document.createElement('section'),title=document.createElement('h2'),faces=document.createElement('div');title.textContent=name;faces.className='faces';for(const expression of EXPRESSIONS){const p=portraitFor(name,'',expression),figure=document.createElement('figure'),face=document.createElement('div'),caption=document.createElement('figcaption');face.className='face';face.style.backgroundImage='url("'+p.src+'")';face.style.backgroundPosition=p.position;face.setAttribute('role','img');face.setAttribute('aria-label',name+' '+expression);caption.textContent=expression;figure.append(face,caption);faces.append(figure);}section.append(title,faces);document.getElementById('portraits').append(section);}
</script></html>
