<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character animation preview</title><style>body{margin:0;background:#faf0d6;color:#354b3c;font:16px system-ui;padding:20px}button,select{font:inherit;padding:10px;margin:4px;min-height:44px}canvas{display:block;background:#8da16b;image-rendering:pixelated;max-width:100%;width:768px;border:2px solid #466a50}p{max-width:760px}</style><h1>Mara and Orin · walking check</h1><p>Pass → left leg and right arm forward → pass → right leg and left arm forward.</p><label>Direction <select id="dir"><option>down</option><option>left</option><option>right</option><option>up</option></select></label><button id="pause">Pause</button><button id="next">Next frame</button><p id="phase" role="status"></p><canvas id="view" width="768" height="300" aria-label="Mara and Orin walking preview"></canvas><script type="module">
import {prepareCharacters,drawCharacter} from './chapter-characters.js';import {animationFrame,gaitPose} from './chapter-actors.js';
prepareCharacters();const canvas=document.getElementById('view'),c=canvas.getContext('2d'),dir=document.getElementById('dir'),phase=document.getElementById('phase');let running=true,clock=0,last=0;
document.getElementById('pause').onclick=()=>{running=!running;document.getElementById('pause').textContent=running?'Pause':'Play';};document.getElementById('next').onclick=()=>{running=false;document.getElementById('pause').textContent='Play';clock=(Math.floor(clock/150)+1)*150;};
function tick(now){if(running)clock+=Math.min(50,now-last||16);last=now;c.setTransform(3,0,0,3,0,0);c.imageSmoothingEnabled=false;c.clearRect(0,0,256,100);const frame=animationFrame({direction:dir.value,walking:true,clock});const gait=gaitPose(frame);phase.textContent='Frame '+(frame%4+1)+' · '+(gait.leftLeg>0?'Left leg / right arm forward':gait.rightLeg>0?'Right leg / left arm forward':'Passing pose');for(const [i,name]of ['mara','orin'].entries()){drawCharacter(c,{name,direction:dir.value,walking:true,frame},72+i*112,72);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
