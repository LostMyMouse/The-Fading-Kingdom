<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player sprite quality matrix</title><style>*{box-sizing:border-box}body{margin:0;background:#faf0d6;color:#354b3c;padding:20px;font:15px/1.5 system-ui}main{max-width:1000px;margin:auto}h1{font:30px Georgia}h2{font:21px Georgia;margin:0 0 8px}.row{margin:22px 0}.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}figure{margin:0}canvas{width:100%;height:130px;background:#8da16b;display:block}figcaption{text-align:center;font-size:13px}.note{max-width:800px}@media(max-width:600px){body{padding:12px}.views{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><main><h1>Player sprite · quality matrix</h1><p class="note">Every wardrobe combination in front, left, right and back views. Each cell shows the two opposite contact poses, drawn with the production player renderer. This page never reads or writes your story.</p><div id="matrix"></div></main><script type="module">
import {preparePlayer,drawPlayer} from './player-layered.js';await preparePlayer();const root=document.getElementById('matrix'),rows=[];
for(const style of [0,1,3,4])for(const outfit of [0,1])for(const hat of [0,1])rows.push({name:({0:'Tousled',1:'Tied back',3:'Rounded bob',4:'Twin puffs'}[style])+' · '+(outfit?'Vest':'Linen')+' · '+(hat?'Cap':'No hat'),look:{skin:1,hair:0,shirt:0,style,outfit,hat}});
for(const style of [3,4])for(const key of ['skin','hair','shirt'])for(let i=0;i<6;i++)rows.push({name:({3:'Bob',4:'Puffs'}[style])+' '+key+' palette '+(i+1),look:{skin:1,hair:0,shirt:0,style,outfit:0,hat:0,[key]:i}});
for(const {name,look}of rows){const section=document.createElement('section'),title=document.createElement('h2'),views=document.createElement('div');section.className='row';views.className='views';title.textContent=name;for(const direction of ['down','left','right','up']){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.setAttribute('aria-label',name+' '+direction+' opposite contact poses');caption.textContent={down:'Front',left:'Left',right:'Right',up:'Back'}[direction];figure.append(canvas,caption);views.append(figure);const paint=()=>{const b=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(b.width*dpr);canvas.height=Math.round(b.height*dpr);const c=canvas.getContext('2d'),zoom=2;c.setTransform(dpr*zoom,0,0,dpr*zoom,0,0);c.imageSmoothingEnabled=false;drawPlayer(c,b.width/zoom*.3,52,look,1,direction,true);drawPlayer(c,b.width/zoom*.7,52,look,3,direction,true);};requestAnimationFrame(paint);window.addEventListener('resize',paint);}section.append(title,views);root.append(section);}
</script></html>
